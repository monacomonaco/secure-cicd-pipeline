version: 2
updates:
  # Pinned Actions (checkout@v4, trivy-action@0.24.0, etc.) are a supply
  # chain surface too — Dependabot keeps them current instead of stale-and-
  # unpatched, which is the more common failure mode than any single CVE.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/app"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/infra/terraform"
    schedule:
      interval: "weekly"
